<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد قانون العمل القطري</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #5a2d82;
            border-color: #5a2d82;
        }
        .btn-primary:hover {
            background-color: #482469;
            border-color: #482469;
        }
        #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="card p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#5a2d82" class="bi bi-briefcase-fill" viewBox="0 0 16 16">
                        <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3h6v-.5A1.5 1.5 0 0 0 9.5 1h-3z"/>
                        <path d="M0 4.5A1.5 1.5 0 0 1 1.5 3h13A1.5 1.5 0 0 1 16 4.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5v-8zM5 8h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1z"/>
                    </svg>
                    <h1 class="h3 mt-3">مساعد قانون العمل القطري الذكي</h1>
                    <p class="text-muted">أدخل وصف الحالة للحصول على تحليل قانوني فوري</p>
                </div>
                <form action="/analyze" method="post" onsubmit="showLoading()">
                    <div class="mb-3">
                        <label for="query" class="form-label">نص القضية:</label>
                        <textarea class="form-control" id="query" name="query" rows="8" required placeholder="مثال: تم فصلي من العمل بسبب الغياب لمدة ٨ أيام متصلة دون تقديم عذر..."></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <span id="button-text">تحليل الحالة</span>
                            <div id="loading" class="spinner-border spinner-border-sm" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </div>
                </form>
                {% if error %}
                    <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('button-text').style.display = 'none';
            document.getElementById('loading').style.display = 'inline-block';
        }
    </script>
</body>
</html>
