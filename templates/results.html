<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج التحليل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 900px;
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .analysis-content {
            background-color: #ffffff;
            border-right: 5px solid #5a2d82;
            padding: 20px;
            border-radius: 5px;
            line-height: 1.8;
        }
        .query-box {
            background-color: #e9ecef;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="card p-4">
            <div class="card-body">
                <h1 class="h3 mb-4 text-center">تحليل الحالة القانونية</h1>

                <div class="query-box">
                    <h5 class="mb-2">نص القضية المُدخل:</h5>
                    <p class="mb-0"><em>{{ query }}</em></p>
                </div>

                <hr>

                <h5 class="mb-3">التحليل القانوني:</h5>
                <div class="analysis-content">
                    <p>{{ analysis | safe }}</p>
                </div>

                <div class="text-center mt-4">
                    <a href="/" class="btn btn-secondary">تحليل حالة جديدة</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
